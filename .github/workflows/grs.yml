name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cards
        run: |
          mkdir -p profile
          fetch_card () {
            url="$1"
            out="$2"
            tmp=$(mktemp)
            code=$(curl -sL -w "%{http_code}" -o "$tmp" "$url")
            if [ "$code" = "200" ] && head -c 200 "$tmp" | grep -qi "<svg"; then
              cp "$tmp" "$out"
              echo "OK: $out"
            else
              echo "SKIP (http $code, invalid content): $out"
            fi
            rm -f "$tmp"
          }
          fetch_card "https://github-readme-stats.vercel.app/api?username=miguellima2326&show_icons=true&bg_color=0d1117&border_color=1f6feb30&icon_color=58a6ff&title_color=58a6ff&text_color=c9d1d9&hide_border=false" "profile/stats.svg"
          fetch_card "https://github-readme-stats.vercel.app/api/top-langs/?username=miguellima2326&layout=compact&bg_color=0d1117&border_color=1f6feb30&title_color=58a6ff&text_color=c9d1d9&hide_border=false" "profile/top-langs.svg"

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
